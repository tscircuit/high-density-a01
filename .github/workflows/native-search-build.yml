name: Native Search Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-generated-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --target wasm32-unknown-unknown
      - name: Rebuild embedded kernel
        run: bun scripts/build-native-search.ts
      - name: Verify generated bytes
        run: git diff --exit-code -- lib/native-search/a01SearchWasmBytes.ts
      - name: Test exact A03 Rust state and heap oracles
        run: cargo +1.93.1 test --locked --manifest-path native-search-a03/Cargo.toml
      - name: Rebuild separate A03 kernel
        run: bun scripts/build-native-a03-search.ts
      - name: Verify A03 generated bytes
        run: git diff --exit-code -- lib/native-search/a03SearchWasmBytes.ts
      - name: Verify cached A03 module states and lifecycle
        run: |
          bun native-search-a03/tests/wasm-oracle.ts
          bun native-search-a03/tests/wasm-lifecycle.ts
          bun native-search-a03/tests/distance-seed-oracle.ts
      - name: Build uncached A03 host-order reference module
        env:
          RUSTFLAGS: -C link-arg=-zstack-size=65536
        run: cargo +1.93.1 build --locked --manifest-path native-search-a03/Cargo.toml --target wasm32-unknown-unknown --release --features uncached-distance-oracle --target-dir native-search-a03/target-oracle
      - name: Verify original A03 host order and partial exceptions
        run: bun native-search-a03/tests/wasm-oracle.ts --uncached native-search-a03/target-oracle/wasm32-unknown-unknown/release/a03_exact_search_preparation.wasm
