[package]
name = "a03_exact_search_preparation"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dev-dependencies]
flate2 = "=1.1.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
# Actual-module reference build only; the production adapter always caches.
uncached-distance-oracle = []
