67.87976847659047,545.6741537624307 248.25803425601225,526.2251478484908 228.6363000354354,506.77614193455156 209.01456581485718,487.32713602061165 189.39283159428032,467.87813010667173 169.7710973737021,448.4291241927325 169.7710973737021,428.9801182787926 169.7710973737021,409.53111236485336 169.7710973737021,390.08210645091344 169.7710973737021,370.63310053697353 169.7710973737021,351.1840946230343 169.7710973737021,331.7350887090945 169.7710973737021,312.28608279515515 169.7710973737021,292.83707688121535 150.14936315312434,273.38807096727544 150.14936315312434,253.9390650533362 150.14936315312434,234.4900591393963 150.14936315312434,215.04105322545706 150.14936315312434,195.59204731151704 150.14936315312434,176.14304139757712 169.7710973737021,156.6940354836379 189.39283159428032,137.24502956969798 209.01456581485718,117.79602365575875 228.6363000354354,98.34701774181883 248.25803425601225,78.89801182787892 267.87976847659047,59.44900591393957 287.50150269716823,59.44900591393957 307.12323691774554,59.44900591393957 326.7449711383233,40 346.3667053589006,40 365.9884395794784,59.44900591393957 385.61017380005615,78.89801182787892 405.23190802063345,98.34701774181883 424.8536422412117,117.79602365575875 405.23190802063345,137.24502956969798 385.61017380005615,156.6940354836379 359.85664763554814,192.95151196219012" fill="none" stroke="rgba(128,128,128,0.75)" stroke-width="34.496912360856484"/></g><circle data-type="circle" data-label="" data-x="17.69844339622641" data-y="2.8995851358846365" cx="267.87976847659047" cy="545.6741537624307" r="54.325846237569266" fill="rgba(0,0,0,0.3)" stroke="black" stroke-width="0.005154084462403917"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":194.0208794198902,"c":0,"e":-3165.987783622406,"b":0,"d":-194.0208794198902,"f":1108.2542117796097};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>