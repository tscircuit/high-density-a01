 18.709764150943393,3.300552412645591 18.810896226415093,3.2003105934553515" data-type="line" data-label="" points="243.02241096893067,112.74931849033192 280.4860802068124,153.16992009732303 309.02982819757835,181.46240012165435 337.5735761883452,209.75488014598454 337.5735761883452,238.04736017031587 337.5735761883452,266.33984019464697 337.5735761883452,294.6323202189774 337.5735761883452,322.9248002433085 337.5735761883452,351.21728026763867 337.5735761883452,379.50976029197 337.5735761883452,407.8022403163012 337.5735761883452,436.0947203406314 366.11732417911116,464.3872003649627 394.661072169878,492.6796803892929 423.2048201606449,520.9721604136242" fill="none" stroke="rgba(128,128,128,0.75)" stroke-width="50.18267813734867"/></g><g><polyline data-points="18.810896226415093,3.2003105934553515 18.709764150943393,3.2003105934553515 18.608632075471693,3.2003105934553515 18.507499999999997,3.2003105934553515 18.406367924528297,3.2003105934553515 18.3052358490566,3.2003105934553515 18.172499999999996,3.046666666666635" data-type="line" data-label="" points="423.2048201606449,520.9721604136242 394.661072169878,520.9721604136242 366.11732417911116,520.9721604136242 337.5735761883452,520.9721604136242 309.02982819757835,520.9721604136242 280.4860802068124,520.9721604136242 243.02241096893067,564.3369732696226" fill="none" stroke="rgba(255,0,0,0.75)" stroke-width="50.18267813734867"/></g><circle data-type="circle" data-label="" data-x="18.810896226415093" data-y="3.2003105934553515" cx="423.2048201606449" cy="520.9721604136242" r="79.02783958637585" fill="rgba(0,0,0,0.3)" stroke="black" stroke-width="0.003543055225417944"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":282.2422842370566,"c":0,"e":-4886.025499328979,"b":0,"d":-282.2422842370566,"f":1424.2351325785128};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>