 4.0088915000000656,-8.525004000000038 3.908891500000066,-8.525004000000038 3.8088915000000654,-8.525004000000038 3.7088915000000657,-8.525004000000038 3.608891500000066,-8.525004000000038 3.5088915000000656,-8.525004000000038 3.408891500000066,-8.525004000000038 3.3088915000000654,-8.525004000000038 3.2088915000000657,-8.525004000000038 3.2088915000000657,-8.62500400000004 3.129446150000087,-8.675004000000039" data-type="line" data-label="" points="431.24240422757714,485.5265153611954 411.17869119026545,485.5265153611954 391.1149781529539,485.5265153611954 371.0512651156423,485.5265153611954 350.9875520783305,485.5265153611954 330.92383904101894,485.5265153611954 310.86012600370725,485.5265153611954 290.79641296639556,485.5265153611954 270.732699929084,485.5265153611954 250.6689868917723,485.5265153611954 230.60527385446073,485.5265153611954 210.54156081714893,485.5265153611954 190.47784777983736,485.5265153611954 170.4141347425258,485.5265153611954 150.3504217052141,485.5265153611954 130.28670866790253,485.5265153611954 110.22299563059073,485.5265153611954 90.15928259327916,485.5265153611954 90.15928259327916,505.5902283985074 74.21959554779562,515.622084917163" fill="none" stroke="rgba(255,0,0,0.75)" stroke-width="20.063713037311647"/></g><g><rect data-type="rect" data-label="" data-x="4.354445750000032" data-y="-7.699999600000035" x="40" y="124.37791508283703" width="560" height="391.24416983432593" fill="none" stroke="gray" stroke-width="0.004984122321428451"/></g><circle data-type="circle" data-label="" data-x="4.908891500000066" data-y="-8.525004000000038" cx="431.24240422757714" cy="485.5265153611954" r="30.09556955596747" fill="rgba(0,0,0,0.3)" stroke="black" stroke-width="0.004984122321428451"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":200.63713037311646,"c":0,"e":-553.6634996454193,"b":0,"d":-200.63713037311646,"f":-1224.9058236181515};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>