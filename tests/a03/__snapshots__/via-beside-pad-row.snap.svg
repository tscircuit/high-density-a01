4,0" data-type="line" data-label="" points="443.75,339.921875 444.5373062015504,339.921875" fill="none" stroke="rgba(255,0,0,0.75)" stroke-width="25"/></g><g><polyline data-points="0.0025193798449612424,0 0,0" data-type="line" data-label="" points="444.5373062015504,339.921875 443.75,339.921875" fill="none" stroke="rgba(0,0,255,0.75)" stroke-width="25"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="0.1625" x="342.1875" y="238.359375" width="203.125" height="101.5625" fill="none" stroke="gray" stroke-width="0.0032"/></g><circle data-type="circle" data-label="" data-x="0.0025193798449612424" data-y="0" cx="444.5373062015504" cy="339.921875" r="54.6875" fill="rgba(0,0,0,0.3)" stroke="black" stroke-width="0.0032"/><circle data-type="circle" data-label="" data-x="-0.325" data-y="-0.325" cx="342.1875" cy="441.484375" r="54.6875" fill="rgba(120,120,120,0.25)" stroke="gray" stroke-width="0.0032"/><circle data-type="circle" data-label="" data-x="0.325" data-y="-0.325" cx="545.3125" cy="441.484375" r="54.6875" fill="rgba(120,120,120,0.25)" stroke="gray" stroke-width="0.0032"/><circle data-type="circle" data-label="" data-x="-0.325" data-y="0.325" cx="342.1875" cy="238.359375" r="54.6875" fill="rgba(120,120,120,0.25)" stroke="gray" stroke-width="0.0032"/><circle data-type="circle" data-label="" data-x="0.325" data-y="0.325" cx="545.3125" cy="238.359375" r="54.6875" fill="rgba(120,120,120,0.25)" stroke="gray" stroke-width="0.0032"/><text data-type="text" data-label="Trace–via copper gap: 0.110 mm; minimum 0.100 mm" data-x="-0.5" data-y="0.6" x="287.5" y="152.421875" fill="black" font-size="17.1875" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Trace–via copper gap: 0.110 mm; minimum 0.100 mm</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":312.5,"c":0,"e":443.75,"b":0,"d":-312.5,"f":339.921875};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>