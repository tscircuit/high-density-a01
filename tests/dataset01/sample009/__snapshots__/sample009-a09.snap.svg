87745" r="38.73100624537476" fill="rgba(0,0,0,0.300)" stroke="black" stroke-width="0.0038728660714285714"/><circle data-type="circle" data-label="" data-x="14.101496000000001" data-y="-4.243805" cx="171.52998079587633" cy="380.5242979428763" r="38.73100624537476" fill="rgba(0,0,0,0.300)" stroke="black" stroke-width="0.0038728660714285714"/><circle data-type="circle" data-label="" data-x="15.001496" data-y="-4.543805" cx="403.9160182681244" cy="457.98631043362593" r="38.73100624537476" fill="rgba(0,0,0,0.300)" stroke="black" stroke-width="0.0038728660714285714"/><circle data-type="circle" data-label="" data-x="14.901496000000002" data-y="-3.3438049999999997" cx="378.09534743787526" cy="148.13826047062776" r="38.73100624537476" fill="rgba(0,0,0,0.300)" stroke="black" stroke-width="0.0038728660714285714"/><text data-type="text" data-label="[solved, best 6/6]" data-x="13.851496000000001" data-y="-2.9250000000000003" x="106.97830372025146" y="40" fill="black" font-size="36.14893916234978" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">[solved, best 6/6]</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":258.2067083024984,"c":0,"e":-3469.570883504972,"b":0,"d":-258.2067083024984,"f":-715.2546217848078};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>