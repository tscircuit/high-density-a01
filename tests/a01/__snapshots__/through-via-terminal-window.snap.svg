6.5665236051502,318.80082361015786 438.9699570815451,318.80082361015786 441.37339055793996,318.80082361015786 443.7768240343348,318.80082361015786 446.18025751072963,318.80082361015786 448.5836909871245,318.80082361015786 450.98712446351936,318.80082361015786 453.3905579399142,318.80082361015786 455.79399141630904,318.80082361015786 458.19742489270385,318.80082361015786 460.6008583690988,318.80082361015786 460,320" fill="none" stroke="rgba(0,128,0,0.75)" stroke-width="5.2425531914893675"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="0" x="40" y="134.1276595744676" width="560" height="371.7446808510648" fill="none" stroke="gray" stroke-width="0.04196428571428567"/></g><circle data-type="circle" data-label="" data-x="-5.90021459227467" data-y="-2.96903225806452" cx="179.3991416309013" cy="390.7514070006865" r="10.723404255319162" fill="rgba(0,0,255,0.08)" stroke="black" stroke-width="0.04196428571428567"/><text data-type="text" data-label="via landings: z0, z2" data-x="-5.90021459227467" data-y="-4.006532258064519" x="179.3991416309013" y="415.47481125600564" fill="blue" font-size="14" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">via landings: z0, z2</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":23.82978723404258,"c":0,"e":320,"b":0,"d":-23.82978723404258,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>